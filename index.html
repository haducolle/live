<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はづコレ'25春</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #333;
      background-color: #fff0f5;
      overflow: hidden;
    }

    /* 背景動画 */
    #backgroundVideo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* タイトルと告知文 */
    .content {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -30%);
      text-align: center;
      padding: 20px 40px;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
    }

    .content h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #d16a7f;
    }

    .content p {
      font-size: 1.2rem;
      color: #444;
    }

    /* 音声ボタン */
    .soundBtn {
      position: absolute;
      top: 20px;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.7);
      border: 2px solid #d16a7f;
      color: #d16a7f;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      z-index: 1000;
      transition: background-color 0.3s, color 0.3s;
    }

    .soundBtn:hover {
      background-color: #d16a7f;
      color: white;
    }

    #soundOn {
      left: 20px;
    }

    #soundOff {
      left: 140px;
    }
  </style>
</head>
<body>

  <!-- 背景動画 -->
  <video id="backgroundVideo" autoplay loop muted playsinline>
    <source src="waiting.mp4" type="video/mp4">
    お使いのブラウザは video タグをサポートしていません。
  </video>

  <!-- 告知コンテンツ -->
  <div class="content">
    <h1>はづコレ'25春</h1>
    <p>はづコレ'25春の中継用限定公開リンクは、<br>ライブ開始が近くなりましたらこのページに掲載します。</p>
  </div>

  <!-- 音声切り替えボタン -->
  <button class="soundBtn" id="soundOn" onclick="enableSound()">🔊 音声ON</button>
  <button class="soundBtn" id="soundOff" onclick="disableSound()">🔇 音声OFF</button>

  <script>
    const video = document.getElementById("backgroundVideo");

    function enableSound() {
      video.muted = false;
      video.play();
    }

    function disableSound() {
      video.muted = true;
      video.play();
    }
  </script>

</body>
</html>
