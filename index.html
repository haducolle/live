<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はづコレライブ配信</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #player { width: 560px; height: 315px; margin: auto; }
  </style>
</head>
<body>
  <h1>現在の配信状況</h1>
  <div id="player">読み込み中...</div>

  <script>
    const API_KEY = 'AIzaSyBhj8u4YxIZSgeu0CTuwiAlZxFbIR634a0'; // 後で置換
    const CHANNEL_ID = 'UCSWZa6rj_4WVcB5TNl5zNbg'; // 後で置換

    async function checkLive() {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`);
      const data = await res.json();
      const container = document.getElementById('player');

      if (data.items && data.items.length > 0) {
        const videoId = data.items[0].id.videoId;
        container.innerHTML = `<iframe width="560" height="315" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
      } else {
        container.innerHTML = `<img src="offline.jpg" alt="現在配信は行われていません。" width="560" height="315">`;
      }
    }

    checkLive();
  </script>
</body>
</html>
