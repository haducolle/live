<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はづコレライブ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      height: 100%;
      width: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: sans-serif;
      color: white;
    }

    #player {
      width: 100%;
      max-width: 1920px;
      height: auto;
      aspect-ratio: 16 / 9;
      background-color: black;
    }

    iframe, img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 20px 0;
      font-size: 2rem;
    }

    #soundOn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid white;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 1000;
      transition: background-color 0.3s, border-color 0.3s;
    }

    #soundOn:hover {
      background-color: rgba(255, 255, 255, 0.3);
      border-color: #ccc;
    }
  </style>
</head>
<body>
  <!-- <h1>現在の配信状況</h1> -->
  <div id="player">読み込み中...</div>
  <button id="soundOn" onclick="enableSound()">音声ON</button>
  <button id="soundOff" onclick="disableSound()">音声OFF</button>
  <script>
    const API_KEY = 'AIzaSyBhj8u4YxIZSgeu0CTuwiAlZxFbIR634a0'; // 後で置換
    const CHANNEL_ID = 'UCSWZa6rj_4WVcB5TNl5zNbg'; // 

    function enableSound() {
      const video = document.getElementById("vid");
      video.muted = false;
      video.play(); // 再生し直し
    }
    function disableSound() {
      const video = document.getElementById("vid");
      video.muted = true;
      video.play(); // 再生し直し
    }

    async function checkLive() {
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`);
        const data = await res.json();
        const container = document.getElementById('player');

        if (data.items && data.items.length > 0) {
          const videoId = data.items[0].id.videoId;
          container.innerHTML = `
            <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
                    frameborder="0"
                    allowfullscreen></iframe>`;
        } else {
          //container.innerHTML = `<img src="offline.jpg" alt="現在配信は行われていません。">`;
          container.innerHTML = `
            <video id="vid" width="100%" height="100%" autoplay loop muted playsinline>
              <source src="waiting.mp4" type="video/mp4">
              お使いのブラウザは video タグをサポートしていません。
          </video>`;
        }
      } catch (error) {
        document.getElementById('player').innerText = 'エラーが発生しました。';
        console.error(error);
      }
    }

    checkLive();
  </script>
</body>
</html>
