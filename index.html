<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はづコレ'25春</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff0f5; /* 薄い春ピンク */
      font-family: sans-serif;
      color: #333;
      text-align: center;
    }

    h1 {
      margin-top: 2em;
      color: #d16a7f;
    }

    p {
      font-size: 1.2rem;
    }

    .videoFrame {
      margin: 2em auto;
      width: 80%;
      max-width: 800px;
      border: 3px solid #d16a7f;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .qrSection {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2em;
      margin: 2em auto;
      flex-wrap: wrap;
      max-width: 800px;
    }

    .qrBlock {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5em;
      flex: 1 1 240px; /* 幅が狭い時は縦並び */
    }

    .qrBlock a {
      color: #d16a7f;
      font-weight: bold;
      text-decoration: none;
      margin-bottom: 0.5em;
      font-size: 1rem;
    }

    .qrBlock img {
      width: 100%;
      max-width: 220px;
      height: auto;
      border: 2px solid #d16a7f;
      border-radius: 8px;
    }

    @media screen and (max-width: 600px) {
      .qrSection {
        flex-direction: column;
        align-items: center;
      }

      .qrBlock {
        width: 100%;
        max-width: 300px;
      }

      .qrBlock a {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <h1>はづコレ'25春</h1>

  <div class="qrSection">
    <div class="qrBlock">
      <a href="https://youtube.com/live/_UrQark241g?feature=share" target="_blank">はづコレ中継を見る</a>
      <a href="https://youtube.com/live/_UrQark241g?feature=share" target="_blank">
        <img src="25SpringStreraming.png" alt="はづコレライブ中継QRコード">
      </a>
    </div>

    <div class="qrBlock">
      <a href="https://www.youtube.com/watch?v=1cE7ChJiOiY&list=PLh48KQgqBOSnZGEKRbcrMcvOD82Inn1Ok&pp=gAQB" target="_blank">ライブ部門使用曲再生リスト</a>
      <a href="https://www.youtube.com/watch?v=1cE7ChJiOiY&list=PLh48KQgqBOSnZGEKRbcrMcvOD82Inn1Ok&pp=gAQB" target="_blank">
        <img src="25SpringSongLIst.png" alt="使用曲リストQRコード">
      </a>
    </div>
  </div>

  <div class="videoFrame">
    <video autoplay muted loop playsinline controls>
      <source src="waiting.mp4" type="video/mp4">
      動画が再生できません。
    </video>
  </div>

</body>
</html>
